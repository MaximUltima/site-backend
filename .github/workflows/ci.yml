name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: site_test
          POSTGRES_USER: site
          POSTGRES_PASSWORD: site
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U site -d site_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты
        run: ./gradlew test
      - name: Сборка
        run: ./gradlew build -x test
      - name: Образ
        run: docker build -f src/main/docker/Dockerfile.jvm -t site-backend:${{ github.sha }} .
