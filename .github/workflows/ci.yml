name: CI

on:
  push:
    branches: [master, api-v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: site_test
          POSTGRES_USER: site
          POSTGRES_PASSWORD: site
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U site -d site_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # gradlew в репозитории не хранится (.gitignore), поэтому Gradle ставим той же версии,
      # что в gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Тесты
        run: gradle test
      - name: Сборка
        run: gradle build -x test
      - name: Образ
        run: docker build -f src/main/docker/Dockerfile.jvm -t site-backend:${{ github.sha }} .
